name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.13"}
          # the training machine runs Windows
          - {os: windows-latest, python-version: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyflakes
      - name: Lint
        run: python -m pyflakes kdaa tests
      # includes tests/test_e2e.py: three synthetic sound-autodaq sessions through train (1 epoch) and report
      - name: Tests
        run: python -m pytest -q -rs
